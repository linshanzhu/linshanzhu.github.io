project:
  type: website
  output-dir: docs
  render:
    - "*.qmd"
    - "research/*.qmd"
    - "posts/**/*.qmd"
    
# Meta
description-meta: "Personal academic website of Linshan Zhu, Ph.D."
author-meta: "Dr. Linshan Zhu"

website:
  title: "Linshan Zhu, Ph.D."
  description: "Research in synthetic biology, cell engineering, and programmable cellular therapies."
  site-url: "https://linshanzhu.github.io"
 
  navbar:
    background: light  # You can change the background color here
    pinned: true

    left:   # You can comment out all navigation items here if you just like to keep the index page only
      - text: Home
        href: index.qmd         
      - text: Research
        menu:
          - text: Research Hightlights  # Manually curated list of research highlights
            href: projects.qmd  
          - text: Publications  # Manually curated list of publications
            href: publications.qmd
          # - text: Presentations  # Manually curated list of presentations
          #   href: presentations.qmd                                           
      - text: Teaching & Mentoring
        href: teaching.qmd
      - text: News & Events
        href: posts.qmd
      - text: Contact
        href: contact.qmd                     

    # right: 
    #   - text: CV
    #     href: files/CV_Linshan Zhu.pdf 
    #   - icon: rss
    #     href: posts.xml
    #     target: _blank
  
  page-navigation: true
  
  page-footer: 
    left: "Linshan Zhu &copy; <script>document.write(new Date().getFullYear())</script>" 
    center: "Build on [Quarto Academic Website Template](https://github.com/drganghe/quarto-academic-website-template)"
    # right:  
    #   - icon: rss
    #     href: posts.xml
    #     target: _blank  
  
  search:
    location: navbar
    type: textbox
  
  reader-mode: true

  draft-mode: unlinked
  
  repo-url: https://github.com/linshanzhu/linshanzhu.github.io
  
  open-graph: true
  
  twitter-card: true 
  
  
#   google-analytics:
#     tracking-id: ""  # Please delete or replace with your own tracking ID
#     anonymize-ip: true 

# bibliography: references.bib  # Add references.bib to the root folder to enable the bibliography function

format:
  html:
    theme: cosmo
    css: styles.css
    toc: false
    ancho-sections: false
    footnotes-hover: true
    code-copy: true
    code-link: true
    code-overflow: wrap
    fig-align: center
    link-external-icon: false
    link-external-newwindow: true
    email-obfuscation: javascript
    include-in-header: "files/includes/_academic.qmd"

